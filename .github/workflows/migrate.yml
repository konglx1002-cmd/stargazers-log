name: Staging Database Migration

# Retained as an audit record. This legacy staging migration entry is closed.
on: []

permissions:
  contents: read

concurrency:
  group: staging-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Inspect pending migrations
        continue-on-error: true
        run: pnpm exec prisma migrate status

      - name: Deploy migrations
        run: pnpm exec prisma migrate deploy

      - name: Verify migration status
        run: pnpm exec prisma migrate status
