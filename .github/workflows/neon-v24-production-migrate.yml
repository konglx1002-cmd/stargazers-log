name: Neon v2.4 Production — Deploy Once

on:
  workflow_dispatch:
    inputs:
      branch_state:
        description: Confirm Neon production is the intended target and backup snapshot was restored into an independent branch
        required: true
        type: choice
        options:
          - CONFIRMED_PRODUCTION_BACKUP_RESTORE_VERIFIED
      deploy_confirmation:
        description: Type DEPLOY_ONCE_TO_V24_PRODUCTION to authorize production schema migration
        required: true
        type: string
      snapshot_confirmation:
        description: Type VERIFIED_20261023_PRODUCTION_SNAPSHOT_AND_RESTORE to confirm independent backup recovery test
        required: true
        type: string
      endpoint_id:
        description: Enter the confirmed Neon Primary Endpoint ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-v24-production-migration
  cancel-in-progress: false

jobs:
  production-migration-deploy:
    name: Deploy approved migration to production once
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: neon-v24-production-migration

    steps:
      - name: Validate production manual safety gate
        shell: bash
        env:
          CONFIRMED_BRANCH_STATE: ${{ inputs.branch_state }}
          CONFIRMED_ENDPOINT_ID: ${{ inputs.endpoint_id }}
          DEPLOY_CONFIRMATION: ${{ inputs.deploy_confirmation }}
          SNAPSHOT_CONFIRMATION: ${{ inputs.snapshot_confirmation }}
          EXPECTED_ENDPOINT_ID: ep-soft-heart-b3j8smnj
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "This PRODUCTION workflow must be dispatched from the default main branch." >&2
            exit 1
          fi
          if [[ "${DEPLOY_CONFIRMATION}" != "DEPLOY_ONCE_TO_V24_PRODUCTION" ]]; then
            echo "Explicit production migration authorization is missing." >&2
            exit 1
          fi
          if [[ "${CONFIRMED_BRANCH_STATE}" != "CONFIRMED_PRODUCTION_BACKUP_RESTORE_VERIFIED" ]]; then
            echo "The Production backup/restore confirmation is missing." >&2
            exit 1
          fi
          if [[ "${SNAPSHOT_CONFIRMATION}" != "VERIFIED_20261023_PRODUCTION_SNAPSHOT_AND_RESTORE" ]]; then
            echo "A separately restored production pre-migration snapshot is not confirmed." >&2
            exit 1
          fi
          if [[ "${CONFIRMED_ENDPOINT_ID}" != "${EXPECTED_ENDPOINT_ID}" ]]; then
            echo "The manually confirmed Endpoint ID does not match the approved production endpoint." >&2
            exit 1
          fi

      - name: Check out the audited v2.4 commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: 4e35966d5f4f2c47882afbc55ccecd191d871c0b
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out commit and audited Prisma files
        working-directory: target
        shell: bash
        env:
          EXPECTED_COMMIT: 4e35966d5f4f2c47882afbc55ccecd191d871c0b
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_COMMIT}" ]]
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readdirSync, readFileSync } = require("node:fs");

          const expectedFiles = new Map([
            ["prisma/schema.prisma", "4ba91c581021fc5a11bac59761c3dedf4676ebe1444e12a343aba31e1d0c4f3d"],
            ["prisma/migrations/migration_lock.toml", "99836963713b4f5b269ad49af0ed3d7b0b2e336115c2f92dc9ac683d139d0900"],
            ["prisma/migrations/20261014000000_postgresql_init/migration.sql", "579bbc7dfd4b2a16d108f4addb44ae80d1494301460b3773a5b2301dd9fc282c"],
            ["prisma/migrations/20261020152832_add_project_diaries/migration.sql", "0abd0cd9d72881641951106b14a36c58a236730516622872cc95154a6c8a2893"],
          ]);
          const migrationDirectories = readdirSync("prisma/migrations", { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => entry.name)
            .sort();
          const expectedDirectories = [
            "20261014000000_postgresql_init",
            "20261020152832_add_project_diaries",
          ];
          if (JSON.stringify(migrationDirectories) !== JSON.stringify(expectedDirectories)) {
            throw new Error("Unexpected Prisma migration directory set.");
          }
          for (const [file, expectedHash] of expectedFiles) {
            const actualHash = createHash("sha256").update(readFileSync(file)).digest("hex");
            if (actualHash !== expectedHash) {
              throw new Error(`SHA-256 mismatch for ${file}.`);
            }
          }
          NODE

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Enable pnpm 10.34.6
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.6 --activate
          [[ "$(pnpm --version)" == "10.34.6" ]]

      - name: Install locked dependencies and Prisma engines without database credentials
        working-directory: target
        shell: bash
        env:
          DATABASE_URL: postgresql://prisma_engine_check:unused@127.0.0.1:1/prisma_engine_check?schema=public&connect_timeout=1
          DIRECT_URL: postgresql://prisma_engine_check:unused@127.0.0.1:1/prisma_engine_check?schema=public&connect_timeout=1
        run: pnpm install --frozen-lockfile

      - name: Verify Prisma CLI and Linux engines
        working-directory: target
        shell: bash
        env:
          DATABASE_URL: postgresql://prisma_engine_check:unused@127.0.0.1:1/prisma_engine_check?schema=public&connect_timeout=1
          DIRECT_URL: postgresql://prisma_engine_check:unused@127.0.0.1:1/prisma_engine_check?schema=public&connect_timeout=1
        run: |
          set -euo pipefail
          version_file="${RUNNER_TEMP}/prisma-version.json"
          trap 'rm -f "${version_file}"' EXIT
          pnpm exec prisma version --json > "${version_file}"
          PRISMA_VERSION_FILE="${version_file}" node <<'NODE'
          const { existsSync, readFileSync } = require("node:fs");
          const { resolve } = require("node:path");
          const { spawnSync } = require("node:child_process");

          const output = readFileSync(process.env.PRISMA_VERSION_FILE, "utf8");
          const jsonStart = output.indexOf("{");
          if (jsonStart === -1) throw new Error("Prisma version did not return JSON.");
          const version = JSON.parse(output.slice(jsonStart));
          if (version.prisma !== "6.19.3") throw new Error("Unexpected Prisma CLI version.");
          if (version["operating-system"] !== "linux") throw new Error("Prisma is not running on Linux.");

          function enginePath(key, prefix) {
            const value = version[key];
            if (typeof value !== "string" || !value.startsWith(prefix)) {
              throw new Error(`Prisma did not report the ${key}.`);
            }
            const match = value.match(/\(at (.+)\)$/);
            if (!match) throw new Error(`Prisma did not report a path for the ${key}.`);
            const path = resolve(match[1]);
            if (!existsSync(path)) throw new Error(`The ${key} file is missing.`);
            return path;
          }

          enginePath("query-engine-(node-api)", "libquery-engine ");
          const schemaEngine = enginePath("schema-engine", "schema-engine-cli ");
          const engineVersion = spawnSync(schemaEngine, ["--version"], {
            encoding: "utf8",
            timeout: 10_000,
          });
          if (engineVersion.status !== 0 || !engineVersion.stdout.includes("schema-engine")) {
            throw new Error("The Prisma Schema Engine could not execute.");
          }
          NODE
          pnpm exec prisma validate --schema prisma/schema.prisma

      - name: Validate the production Direct URL identity
        shell: bash
        env:
          NEON_PROD_DIRECT_URL: ${{ secrets.NEON_V24_PROD_DIRECT_URL }}
          CONFIGURED_ENDPOINT_ID: ${{ vars.NEON_V24_PROD_ENDPOINT_ID }}
          CONFIGURED_DATABASE: ${{ vars.NEON_V24_PROD_DATABASE }}
          CONFIGURED_ROLE: ${{ vars.NEON_V24_PROD_ROLE }}
          EXPECTED_ENDPOINT_ID: ep-soft-heart-b3j8smnj
        run: |
          set -euo pipefail
          node <<'NODE'
          const expectedEndpoint = process.env.EXPECTED_ENDPOINT_ID;
          if (process.env.CONFIGURED_ENDPOINT_ID !== expectedEndpoint) {
            throw new Error("The Environment Endpoint variable does not match the approved production endpoint.");
          }
          if (!process.env.CONFIGURED_DATABASE || !process.env.CONFIGURED_ROLE) {
            throw new Error("The expected database name and role Environment variables are required.");
          }
          let url;
          try {
            url = new URL(process.env.NEON_PROD_DIRECT_URL);
          } catch {
            throw new Error("The production connection secret is not a valid URL.");
          }
          if (!new Set(["postgres:", "postgresql:"]).has(url.protocol)) {
            throw new Error("The connection URL is not PostgreSQL.");
          }
          const host = url.hostname.toLowerCase();
          const hostLabel = host.split(".")[0];
          if (hostLabel !== expectedEndpoint || hostLabel.endsWith("-pooler") || !host.endsWith(".neon.tech")) {
            throw new Error("The connection URL is not the approved Neon Direct endpoint.");
          }
          if (url.port && url.port !== "5432") {
            throw new Error("The Direct URL uses an unexpected port.");
          }
          const database = decodeURIComponent(url.pathname.replace(/^\//, ""));
          const role = decodeURIComponent(url.username);
          if (database !== process.env.CONFIGURED_DATABASE || role !== process.env.CONFIGURED_ROLE) {
            throw new Error("The connection URL database or role does not match the approved Environment variables.");
          }
          if (!url.password) {
            throw new Error("The production connection secret has no password.");
          }
          if (url.hash) {
            throw new Error("The Direct URL must not contain a fragment.");
          }
          const allowedParameters = new Set(["sslmode", "channel_binding"]);
          for (const key of url.searchParams.keys()) {
            if (!allowedParameters.has(key)) {
              throw new Error("The Direct URL contains an unapproved connection parameter.");
            }
          }
          const sslModes = url.searchParams.getAll("sslmode");
          const channelBindings = url.searchParams.getAll("channel_binding");
          if (
            sslModes.length !== 1 || sslModes[0] !== "require" ||
            channelBindings.length !== 1 || channelBindings[0] !== "require"
          ) {
            throw new Error("The Direct URL must require TLS and channel binding.");
          }
          NODE

      - name: Require exactly the audited pending production migration
        working-directory: target
        shell: bash
        env:
          NEON_PROD_DIRECT_URL: ${{ secrets.NEON_V24_PROD_DIRECT_URL }}
          CONFIGURED_ENDPOINT_ID: ${{ vars.NEON_V24_PROD_ENDPOINT_ID }}
          CONFIGURED_DATABASE: ${{ vars.NEON_V24_PROD_DATABASE }}
          CONFIGURED_ROLE: ${{ vars.NEON_V24_PROD_ROLE }}
          EXPECTED_ENDPOINT_ID: ep-soft-heart-b3j8smnj
          EXPECTED_PENDING_MIGRATION: 20261020152832_add_project_diaries
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          const { spawn } = require("node:child_process");

          function fail(message) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Neon v2.4 PRODUCTION migration preflight status\n\n- Result: failed\n- Reason: ${message}\n`);
            console.error(message);
            process.exit(1);
          }

          const expectedEndpoint = process.env.EXPECTED_ENDPOINT_ID;
          if (process.env.CONFIGURED_ENDPOINT_ID !== expectedEndpoint) {
            fail("Endpoint identity changed after the safety gate.");
          }
          let url;
          try {
            url = new URL(process.env.NEON_PROD_DIRECT_URL);
          } catch {
            fail("The production connection secret is not a valid URL.");
          }
          const host = url.hostname.toLowerCase();
          if (host.split(".")[0] !== expectedEndpoint || !host.endsWith(".neon.tech")) {
            fail("Direct endpoint identity changed after the safety gate.");
          }
          if (
            decodeURIComponent(url.pathname.replace(/^\//, "")) !== process.env.CONFIGURED_DATABASE ||
            decodeURIComponent(url.username) !== process.env.CONFIGURED_ROLE ||
            url.searchParams.getAll("sslmode").length !== 1 ||
            url.searchParams.get("sslmode") !== "require" ||
            url.searchParams.getAll("channel_binding").length !== 1 ||
            url.searchParams.get("channel_binding") !== "require"
          ) {
            fail("Connection identity or TLS settings changed after the safety gate.");
          }
          url.searchParams.set("connect_timeout", "15");
          const connectionUrl = url.toString();
          const child = spawn(
            "./node_modules/.bin/prisma",
            ["migrate", "status", "--schema", "prisma/schema.prisma"],
            {
              env: { ...process.env, DATABASE_URL: connectionUrl, DIRECT_URL: connectionUrl },
              stdio: ["ignore", "pipe", "pipe"],
            },
          );
          let output = "";
          child.stdout.on("data", (chunk) => { output += chunk.toString(); });
          child.stderr.on("data", (chunk) => { output += chunk.toString(); });
          const timer = setTimeout(() => child.kill("SIGTERM"), 90_000);
          child.on("error", () => {
            clearTimeout(timer);
            fail("Prisma CLI could not be started.");
          });
          child.on("close", (code, signal) => {
            clearTimeout(timer);
            if (signal) fail("Prisma migrate status exceeded its bounded execution time.");
            const errorCodes = [...new Set(output.match(/\bP\d{4}\b/g) ?? [])];
            const migrationIds = [...new Set(output.match(/\b20\d{12}_[A-Za-z0-9_-]+\b/g) ?? [])];
            const lower = output.toLowerCase();
            let result;
            if (errorCodes.includes("P1001")) {
              fail("Prisma reported P1001 while connecting to the approved production endpoint.");
            } else if (errorCodes.length > 0) {
              fail(`Prisma reported ${errorCodes.join(", ")}.`);
            } else if (/migration(?:\(s\))?.*failed|failed.*migration|migration history.*diverg|diverg.*migration history/i.test(output)) {
              fail("Prisma reported failed or divergent migration history.");
            } else if (code === 0 && lower.includes("database schema is up to date")) {
              fail("The production migration is not pending; refusing to deploy.");
            } else if (
              code === 1 &&
              lower.includes("2 migrations found") &&
              lower.includes("have not yet been applied") &&
              migrationIds.length === 1 &&
              migrationIds[0] === process.env.EXPECTED_PENDING_MIGRATION
            ) {
              result = "expected pending migration only";
            } else {
              fail(`Unknown Prisma migrate status result (exit code ${String(code)}).`);
            }
            appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `### Neon v2.4 PRODUCTION migration preflight status\n\n- Result: ${result}\n- Prisma exit code: ${String(code)}\n- Target commit: 4e35966d5f4f2c47882afbc55ccecd191d871c0b\n`,
            );
            console.log(`Pre-deploy status verified: ${result}.`);
          });
          NODE

      - name: Confirm PostgreSQL read-only client is available
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { echo "psql is not installed on this runner; stop before any production operation." >&2; exit 1; }
          psql --version

      - name: Capture production old-data baseline (read only)
        working-directory: target
        shell: bash
        env:
          NEON_PROD_DIRECT_URL: ${{ secrets.NEON_V24_PROD_DIRECT_URL }}
          EXPECTED_ENDPOINT_ID: ep-soft-heart-b3j8smnj
          CONFIGURED_ENDPOINT_ID: ${{ vars.NEON_V24_PROD_ENDPOINT_ID }}
          CONFIGURED_DATABASE: ${{ vars.NEON_V24_PROD_DATABASE }}
          CONFIGURED_ROLE: ${{ vars.NEON_V24_PROD_ROLE }}
          BASELINE_FILE: ${{ runner.temp }}/neon-v24-production-baseline.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const { writeFileSync } = require('node:fs');
          function fail() { throw new Error('Production read-only baseline failed. Do not deploy.'); }
          let u;
          try { u = new URL(process.env.NEON_PROD_DIRECT_URL); } catch { fail(); }
          if (!['postgres:', 'postgresql:'].includes(u.protocol) ||
              u.hostname.split('.')[0] !== process.env.EXPECTED_ENDPOINT_ID ||
              !u.hostname.endsWith('.neon.tech') ||
              process.env.CONFIGURED_ENDPOINT_ID !== process.env.EXPECTED_ENDPOINT_ID ||
              (u.port && u.port !== '5432') ||
              decodeURIComponent(u.username) !== process.env.CONFIGURED_ROLE ||
              decodeURIComponent(u.pathname.slice(1)) !== process.env.CONFIGURED_DATABASE ||
              !u.password || u.hash ||
              u.searchParams.getAll('sslmode').length !== 1 || u.searchParams.get('sslmode') !== 'require' ||
              u.searchParams.getAll('channel_binding').length !== 1 || u.searchParams.get('channel_binding') !== 'require' ||
              [...u.searchParams.keys()].some(k => !['sslmode','channel_binding'].includes(k))) fail();
          const sql = `SELECT (SELECT COUNT(*) FROM "User"), (SELECT COUNT(*) FROM "Diary"),
            (SELECT COUNT(*) FROM "Account"), (SELECT COUNT(*) FROM "Session"),
            (SELECT md5(COALESCE(string_agg(to_jsonb(d)::text, '|' ORDER BY d.id), '')) FROM "Diary" d)`;
          const result = spawnSync('psql', ['-X','-A','-t','-F','|','-v','ON_ERROR_STOP=1',
            '-h',u.hostname,'-p',u.port || '5432','-U',decodeURIComponent(u.username),
            '-d',decodeURIComponent(u.pathname.slice(1)),'-c',sql], {
            encoding: 'utf8', timeout: 30000, maxBuffer: 4096,
            env: {...process.env, PGPASSWORD:decodeURIComponent(u.password), PGSSLMODE:'verify-full',
              PGCHANNELBINDING:'require', PGCONNECT_TIMEOUT:'15',
              PGOPTIONS:'-c default_transaction_read_only=on -c statement_timeout=15000'},
          });
          if (result.error || result.status !== 0) fail();
          const values = result.stdout.trim().split('|');
          if (values.length !== 5 || !values.slice(0,4).every(x => /^\d+$/.test(x)) || !/^[a-f0-9]{32}$/.test(values[4])) fail();
          const [users, diaries, accounts, sessions] = values.slice(0,4).map(Number);
          const fingerprint = values[4];
          // Abort if production data changed since the snapshot and manual baseline checks.
          if (users !== 2 || diaries !== 2 || accounts !== 2 ||
              fingerprint !== '0d4154bef55833cceb751ebb4fd1cb37') {
            throw new Error('Production baseline has changed since the reviewed snapshot; abort before deploy.');
          }
          writeFileSync(process.env.BASELINE_FILE, JSON.stringify({users, diaries, accounts, sessions, fingerprint}), {mode:0o600, flag:'wx'});
          console.log('Production read-only baseline captured and reviewed baseline matched; business data not displayed.');
          NODE

      - name: Deploy exactly once to the approved Neon production Direct endpoint
        working-directory: target
        shell: bash
        env:
          NEON_PROD_DIRECT_URL: ${{ secrets.NEON_V24_PROD_DIRECT_URL }}
          CONFIGURED_ENDPOINT_ID: ${{ vars.NEON_V24_PROD_ENDPOINT_ID }}
          CONFIGURED_DATABASE: ${{ vars.NEON_V24_PROD_DATABASE }}
          CONFIGURED_ROLE: ${{ vars.NEON_V24_PROD_ROLE }}
          EXPECTED_ENDPOINT_ID: ep-soft-heart-b3j8smnj
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawn } = require("node:child_process");
          const { appendFileSync } = require("node:fs");
          function fail(reason) {
            console.error(reason);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n### Production deploy\n- Result: failed or not confirmed\n- Reason: ${reason}\n- Automatic retry: no\n`);
            process.exit(1);
          }
          let url;
          try { url = new URL(process.env.NEON_PROD_DIRECT_URL); }
          catch { fail("The production connection secret is not a valid URL."); }
          const endpoint = process.env.EXPECTED_ENDPOINT_ID;
          if (process.env.CONFIGURED_ENDPOINT_ID !== endpoint ||
              !["postgres:", "postgresql:"].includes(url.protocol) ||
              url.hostname.split(".")[0] !== endpoint ||
              !url.hostname.endsWith(".neon.tech") ||
              (url.port && url.port !== "5432") ||
              decodeURIComponent(url.username) !== process.env.CONFIGURED_ROLE ||
              decodeURIComponent(url.pathname.slice(1)) !== process.env.CONFIGURED_DATABASE ||
              !url.password || url.hash ||
              url.searchParams.getAll("sslmode").length !== 1 ||
              url.searchParams.get("sslmode") !== "require" ||
              url.searchParams.getAll("channel_binding").length !== 1 ||
              url.searchParams.get("channel_binding") !== "require" ||
              [...url.searchParams.keys()].some(key => !["sslmode", "channel_binding"].includes(key))) {
            fail("The approved production Direct endpoint identity or TLS parameters do not match.");
          }
          url.searchParams.set("connect_timeout", "15");
          const connection = url.toString();
          const child = spawn("./node_modules/.bin/prisma", ["migrate", "deploy", "--schema", "prisma/schema.prisma"], {
            env: { ...process.env, DATABASE_URL: connection, DIRECT_URL: connection },
            stdio: ["ignore", "pipe", "pipe"],
          });
          let output = "";
          let finished = false;
          const timeout = setTimeout(() => { if (!finished) child.kill("SIGTERM"); }, 150_000);
          child.stdout.on("data", chunk => { output += chunk.toString(); });
          child.stderr.on("data", chunk => { output += chunk.toString(); });
          child.on("error", () => { finished = true; clearTimeout(timeout); fail("Prisma deploy process could not start."); });
          child.on("close", (code, signal) => {
            finished = true;
            clearTimeout(timeout);
            if (signal) fail("Prisma deploy terminated or timed out; the migration outcome is UNKNOWN. Inspect PRODUCTION Neon migration history before any other action.");
            if (code !== 0) fail(`Prisma production deploy returned exit code ${String(code)}. Outcome must be checked in Neon; do not retry automatically.`);
            if (!output.includes("20261020152832_add_project_diaries") || !/migration/i.test(output)) {
              fail("Deploy output did not confirm the approved migration; inspect PRODUCTION Neon manually.");
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "\n### Production deploy\n- Prisma deploy exit code: 0\n- Target: approved v2.4 production Direct endpoint\n- Automatic retry: no\n- Migration history and preserved data: require independent verification\n");
            console.log("Prisma production deploy process completed with exit code 0; verify the database separately.");
          });
          NODE


      - name: Verify production old data unchanged after deploy (read only)
        if: ${{ success() }}
        working-directory: target
        shell: bash
        env:
          NEON_PROD_DIRECT_URL: ${{ secrets.NEON_V24_PROD_DIRECT_URL }}
          EXPECTED_ENDPOINT_ID: ep-soft-heart-b3j8smnj
          CONFIGURED_ENDPOINT_ID: ${{ vars.NEON_V24_PROD_ENDPOINT_ID }}
          CONFIGURED_DATABASE: ${{ vars.NEON_V24_PROD_DATABASE }}
          CONFIGURED_ROLE: ${{ vars.NEON_V24_PROD_ROLE }}
          BASELINE_FILE: ${{ runner.temp }}/neon-v24-production-baseline.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const { readFileSync, unlinkSync, appendFileSync } = require('node:fs');
          function fail() { throw new Error('Post-deploy old-data verification failed: inspect production; do not rerun migration automatically.'); }
          let u;
          try { u = new URL(process.env.NEON_PROD_DIRECT_URL); } catch { fail(); }
          if (!['postgres:','postgresql:'].includes(u.protocol) ||
              u.hostname.split('.')[0] !== process.env.EXPECTED_ENDPOINT_ID ||
              !u.hostname.endsWith('.neon.tech') ||
              process.env.CONFIGURED_ENDPOINT_ID !== process.env.EXPECTED_ENDPOINT_ID ||
              (u.port && u.port !== '5432') ||
              decodeURIComponent(u.username) !== process.env.CONFIGURED_ROLE ||
              decodeURIComponent(u.pathname.slice(1)) !== process.env.CONFIGURED_DATABASE || !u.password || u.hash ||
              u.searchParams.getAll('sslmode').length !== 1 || u.searchParams.get('sslmode') !== 'require' ||
              u.searchParams.getAll('channel_binding').length !== 1 || u.searchParams.get('channel_binding') !== 'require' ||
              [...u.searchParams.keys()].some(k => !['sslmode','channel_binding'].includes(k))) fail();
          const sql = `SELECT (SELECT COUNT(*) FROM "User"), (SELECT COUNT(*) FROM "Diary"),
            (SELECT COUNT(*) FROM "Account"), (SELECT COUNT(*) FROM "Session"),
            (SELECT md5(COALESCE(string_agg(to_jsonb(d)::text, '|' ORDER BY d.id), '')) FROM "Diary" d)`;
          const result = spawnSync('psql', ['-X','-A','-t','-F','|','-v','ON_ERROR_STOP=1',
            '-h',u.hostname,'-p',u.port || '5432','-U',decodeURIComponent(u.username),
            '-d',decodeURIComponent(u.pathname.slice(1)),'-c',sql], {
            encoding:'utf8', timeout:30000, maxBuffer:4096,
            env:{...process.env, PGPASSWORD:decodeURIComponent(u.password), PGSSLMODE:'verify-full',
              PGCHANNELBINDING:'require', PGCONNECT_TIMEOUT:'15',
              PGOPTIONS:'-c default_transaction_read_only=on -c statement_timeout=15000'},
          });
          if (result.error || result.status !== 0) fail();
          const v = result.stdout.trim().split('|');
          if (v.length !== 5 || !v.slice(0,4).every(x => /^\d+$/.test(x)) || !/^[a-f0-9]{32}$/.test(v[4])) fail();
          const before = JSON.parse(readFileSync(process.env.BASELINE_FILE,'utf8'));
          const [users,diaries,accounts,sessions] = v.slice(0,4).map(Number);
          if (users !== before.users || diaries !== before.diaries || accounts !== before.accounts || v[4] !== before.fingerprint) fail();
          unlinkSync(process.env.BASELINE_FILE);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '\n### Production data integrity\n- User, Diary, Account counts: unchanged\n- Diary content fingerprint: unchanged\n- Session count: observed (not compared because sessions can change)\n');
          console.log('Production old-data counts and content fingerprint match the pre-migration baseline.');
          NODE

      - name: Verify production migration status after deploy
        working-directory: target
        shell: bash
        env:
          NEON_PROD_DIRECT_URL: ${{ secrets.NEON_V24_PROD_DIRECT_URL }}
          EXPECTED_ENDPOINT_ID: ep-soft-heart-b3j8smnj
          CONFIGURED_ENDPOINT_ID: ${{ vars.NEON_V24_PROD_ENDPOINT_ID }}
          CONFIGURED_DATABASE: ${{ vars.NEON_V24_PROD_DATABASE }}
          CONFIGURED_ROLE: ${{ vars.NEON_V24_PROD_ROLE }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawn } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          function fail(message) { console.error(message); process.exit(1); }
          let url;
          try { url = new URL(process.env.NEON_PROD_DIRECT_URL); } catch { fail('Invalid production URL.'); }
          if (!['postgres:', 'postgresql:'].includes(url.protocol) ||
              url.hostname.split('.')[0] !== process.env.EXPECTED_ENDPOINT_ID ||
              !url.hostname.endsWith('.neon.tech') ||
              process.env.CONFIGURED_ENDPOINT_ID !== process.env.EXPECTED_ENDPOINT_ID ||
              decodeURIComponent(url.username) !== process.env.CONFIGURED_ROLE ||
              decodeURIComponent(url.pathname.slice(1)) !== process.env.CONFIGURED_DATABASE ||
              !url.password ||
              url.searchParams.getAll('sslmode').length !== 1 || url.searchParams.get('sslmode') !== 'require' ||
              url.searchParams.getAll('channel_binding').length !== 1 || url.searchParams.get('channel_binding') !== 'require' ||
              [...url.searchParams.keys()].some(key => !['sslmode', 'channel_binding'].includes(key))) {
            fail('Production target or TLS identity mismatch.');
          }
          url.searchParams.set('connect_timeout', '15');
          const child = spawn('./node_modules/.bin/prisma', ['migrate', 'status', '--schema', 'prisma/schema.prisma'], {
            env: { ...process.env, DATABASE_URL: url.toString(), DIRECT_URL: url.toString() },
            stdio: ['ignore', 'pipe', 'pipe'],
          });
          let output = '';
          child.stdout.on('data', c => { output += c.toString(); });
          child.stderr.on('data', c => { output += c.toString(); });
          const timeout = setTimeout(() => child.kill('SIGTERM'), 90_000);
          child.on('error', () => { clearTimeout(timeout); fail('Post-deploy Prisma could not start.'); });
          child.on('close', (code, signal) => {
            clearTimeout(timeout);
            if (signal || code !== 0 || /\bP\d{4}\b/.test(output) ||
                !output.toLowerCase().includes('database schema is up to date')) {
              fail('Post-deploy migration status not confirmed; inspect Neon migration history. DO NOT automatically retry.');
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '\n### Production post-deploy status\n- Prisma migration status: up to date\n- Old business data: manual independent verification still required\n');
            console.log('Production migration status confirmed up to date.');
          });
          NODE
